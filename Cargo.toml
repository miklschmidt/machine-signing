[package]
name = "machine-signing"
version = "0.1.0"
edition = "2024"
description = "Sign git commits with a key in the TPM or the Secure Enclave, through git's SSH signing"
license = "MIT"
repository = "https://github.com/miklschmidt/machine-signing"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
p256 = "0.13"
ssh-key = { version = "0.6.7", features = ["ecdsa", "p256", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = "7.7"

[dev-dependencies]
tempfile = "3.27.0"
